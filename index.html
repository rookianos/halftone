<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHRNC HALFTONE WORKS</title>
<style>
*{box-sizing:border-box}body{color-scheme:dark;margin:0;height:100dvh;display:flex;flex-direction:column;background:#1a1a1a;color:#b2b2b2;font:14px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:17px 25px;border-bottom:1px solid #3f3f3f;gap:12px;background:linear-gradient(175deg,#323232,#232323 70%)}h1{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}h1 img{display:block;width:clamp(108px,13vw,150px);height:auto}h1 span{color:#8a8a8a;font:600 9px/1.15 system-ui,sans-serif;letter-spacing:.18em}button,.button,select,input[type=number],textarea{background:#303030;border:1px solid #575757;color:inherit;border-radius:5px;padding:8px 12px;font:inherit}button,.button,select{cursor:pointer}.button{text-decoration:none}[hidden]{display:none!important}button:hover,.button:hover{border-color:#cecece}button:disabled{opacity:.55;cursor:wait}.primary{background:linear-gradient(#dedede,#bababa);color:#151515;border-color:#cecece;font-weight:750}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;flex:1;min-height:0}section{min-height:0;display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid #3f3f3f;gap:10px}.bar b{font:12px monospace;letter-spacing:.12em;color:#cecece}.stage{display:grid;grid-template: minmax(0,1fr) / minmax(0,1fr);container-type:size;place-items:center;flex:1;min-height:0;overflow:hidden;padding:24px;background:radial-gradient(#4c4c4c 1px,transparent 1px) 0 0/16px 16px}.preview-surface{display:block;width:min(100cqw,calc(100cqh * var(--ratio, .8)));height:auto;aspect-ratio:var(--ratio, .8);box-shadow:0 12px 50px #0008;background:repeating-conic-gradient(#c4c4c4 0% 25%,#e5e5e5 0% 50%) 0 0/16px 16px}.preview-surface[hidden]{display:none}textarea::placeholder{color:#909090;opacity:1}.foot{padding:10px 20px;color:#8b8b8b;border-top:1px solid #3f3f3f;font:12px monospace}aside{overflow:auto;border-left:1px solid #3f3f3f;background:#282828}details{padding:0 17px 13px;border-bottom:1px solid #3f3f3f}summary{padding:16px 0 9px;cursor:pointer;font-weight:750}label.control{display:grid;grid-template-columns:1fr auto;gap:4px;margin:9px 0;color:#a9a9a9;font-size:13px}output{font:12px monospace;color:#cecece}input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:#cecece}input[type=color]{width:44px;background:transparent;border:0}input[type=number]{width:85px}textarea{width:100%;resize:vertical}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.muted{color:#8b8b8b;font-size:12px;overflow-wrap:anywhere}label:focus-within{outline-color:#cecece}@media(max-width:740px){body{height:auto}main{grid-template-columns:1fr}.stage{height:58vh;flex:auto;padding:14px}aside{border-left:0}header{padding:10px;flex-wrap:wrap}.bar{padding:9px 10px}}
</style>
<header><h1><img src="cnc-logo.svg" alt="CHRNC"><span>HALFTONE WORKS</span></h1><div class="row"><select id="language" aria-label="介面語言" data-aria-label="介面語言"><option value="zh-Hant" lang="zh-Hant">繁體中文</option><option value="zh-Hans" lang="zh-Hans">简体中文</option></select><button id="png" data-copy="下載 PNG">下載 PNG</button><button id="svg" class="primary" data-copy="下載 SVG">下載 SVG</button><a id="exportLink" class="button" hidden></a></div></header>
<main><section><div class="bar"><b><span data-copy="PREVIEW / 即時預覽">PREVIEW / 即時預覽</span></b><div><button id="original" aria-pressed="false" data-copy="看原圖">看原圖</button> <button id="play" aria-pressed="false" data-copy="播放漂移">播放漂移</button></div></div><div class="stage" id="stage"><svg id="vectorPreview" class="preview-surface" role="img" aria-label="作品預覽" data-aria-label="作品預覽"></svg><canvas id="preview" class="preview-surface" hidden aria-label="作品預覽" data-aria-label="作品預覽"></canvas></div><div class="foot" id="status" role="status"></div></section>
<aside>
<details open><summary><span data-copy="素材與畫布">素材與畫布</span></summary><div class="row"><button class="primary" id="import" data-copy="匯入圖片／影片">匯入圖片／影片</button><input hidden id="file" type="file" accept="image/*,video/*"><button id="demo" data-copy="示範圖">示範圖</button></div><p class="muted" id="source"></p><div class="row"><textarea id="copy" rows="2" aria-label="文字素材" data-aria-label="文字素材" placeholder="輸入文字素材" data-placeholder="輸入文字素材"></textarea><button id="useText" data-copy="套用文字">套用文字</button></div><div id="videoControls" hidden><button id="videoPlay" data-copy="播放影片">播放影片</button><label class="control"><span data-copy="影片時間">影片時間</span><input id="seek" type="range" min="0" max="1" step=".01" value="0"></label></div><div class="row"><label><span data-copy="寬">寬</span> <input id="width" type="number" min="128" max="4096" value="1200"></label><label><span data-copy="高">高</span> <input id="height" type="number" min="128" max="4096" value="1500"></label></div></details>
<details open><summary><span data-copy="切片">切片</span></summary><div class="row"><select id="layout" aria-label="排版" data-aria-label="排版"><option value="random" data-copy="隨機排版">隨機排版</option><option value="grid" data-copy="等分網格">等分網格</option></select><button id="shuffle" data-copy="重新隨機">重新隨機</button></div><div id="slices"></div><div class="row"><select id="shape" aria-label="切片形狀" data-aria-label="切片形狀"><option value="rect" data-copy="方形">方形</option><option value="round" data-copy="圓角">圓角</option><option value="ellipse" data-copy="橢圓">橢圓</option></select><label><input type="checkbox" id="fit"> <span data-copy="圖像隨切片尺寸縮放">圖像隨切片尺寸縮放</span></label></div></details>
<details><summary><span data-copy="取樣與變形">取樣與變形</span></summary><div id="warp"></div></details>
<details open><summary><span data-copy="網紋與顏色">網紋與顏色</span></summary><div class="row"><select id="mode" aria-label="網紋類型" data-aria-label="網紋類型"><option value="mix" data-copy="混合網紋">混合網紋</option><option value="dots" data-copy="圓點">圓點</option><option value="lines" data-copy="平行線">平行線</option><option value="cross" data-copy="交叉線">交叉線</option></select><select id="target" aria-label="編輯目標" data-aria-label="編輯目標"><option value="all" data-copy="整體">整體</option></select></div><div id="screen"></div><div class="row"><label><span data-copy="墨色">墨色</span> <input type="color" id="ink" value="#171815"></label><label><span data-copy="底色">底色</span> <input type="color" id="paper" value="#f3f1e6"></label></div><div class="row"><label><input type="checkbox" id="transparent"><span data-copy="透明背景">透明背景</span></label><label><input type="checkbox" id="invert"><span data-copy="反相">反相</span></label><button id="clearPatch" data-copy="清除局部設定">清除局部設定</button></div></details>
</aside></main>
<script src="language.js"></script><script src="studio-v7.js"></script></html>
